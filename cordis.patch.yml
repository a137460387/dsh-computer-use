# The dsh-computer-use bundle patch: the desktop Computer Use capability as
# one host-plane row. Applied after @deepseek-ai/dsh-base and
# @deepseek-ai/dsh-web-app (installation order), before the profile's own
# cordis.patch.yml, the home-level one, and any --patch overlay — a later
# layer can override this row by id.
#
# A patch replaces the targeted row's whole `config`, so a deployment
# overriding any field below must restate every key it needs.
#
# Config keys correspond one-to-one to the Schemastery schema in
# src/config.ts; schema defaults (danger patterns, allowed apps, subprocess
# and audit tunables) are omitted here and stay editable from any later layer.
#
# Vision routes ship UNCONFIGURED: the four route fields default to the empty
# string and the plugin refuses activation with guidance until a deployment
# names its own routes. Configure them in the profile's cordis.patch.yml or
# the home-level $DSH_HOME/cordis.patch.yml (later layers override this row
# by id — restate every key you need, a patch replaces the whole config):
#
#   - id: computer-use
#     config:
#       visionProvider: <your provider route>        # e.g. an llm-pi-ai.providers settings key
#       visionModel: <vision-capable model id>       # must advertise image input
#       changeDetectionProvider: <your provider route>
#       changeDetectionModel: <cheap model id>
#       visionMaxOutputTokens: 2048
#       visionTimeoutMs: 120000
#       maxSteps: 30
#       stepDelayMs: 1500
#       screenshotMaxWidth: 1280
#       screenshotQuality: 75
#       observationTtlMs: 30000
#       consecutiveFailureCount: 3
#       similarityThreshold: 5
#       takeoverHotkey: [ctrl, alt, u]     # pauses/resumes actions; empty disables
#       pauseOnUserInput: true
#       userInputGraceMs: 250
#       monitorStartupGraceMs: 500
#       sensitiveWindowPatterns:           # title regexes refusing capture
#         - 1password
#         - keepass
#         - bitwarden
#         - netbank
#         - 网银
#         - 密码管理器
#       sensitiveWindowAllowlist: []       # title regexes beating the blocklist
#       pythonCommand: python
#       serverMode: !!js process.env.DSH_CU_MODE
#       processGraceMs: 5000
#       rpcTimeoutMs: 60000
#       healthCheckIntervalMs: 30000
#       healthCheckTimeoutMs: 5000
#       autoApprovalWindowMs: 300000
#       autoApprovalMaxGrants: 50
#       auditLogPath: !!js dshHomePath('logs/dsh-cu-audit.log')
#       screenshotArchivePath: !!js dshHomePath('logs/dsh-cu-screenshots')
#       auditRetentionDays: 7

- insert:
    - id: computer-use
      name: dsh-computer-use
      config:
        # Paths are deployment-local facts the schema cannot default; the
        # model routes above stay empty until a later layer configures them.
        auditLogPath: !!js dshHomePath('logs/dsh-cu-audit.log')
        screenshotArchivePath: !!js dshHomePath('logs/dsh-cu-screenshots')
